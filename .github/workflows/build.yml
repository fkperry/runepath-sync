name: RunePath Sync Java build
on:
  push:
    branches: [master, feature/runepath-sync-mvp]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test (Java 11 target)
        run: ./gradlew --no-daemon clean build
