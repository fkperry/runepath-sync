name: RunePath Sync Java build
on:
  push:
    branches: [master, feature/runepath-sync-mvp]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test (Java 11 target)
        run: ./gradlew --no-daemon clean build
      - name: Upload small sidebar update for existing Windows testers
        if: github.ref == 'refs/heads/feature/runepath-sync-mvp'
        uses: actions/upload-artifact@v4
        with:
          name: RunePath-sidebar-update
          path: build/classes/java/main/com/runepath/sync/RunePathSyncPanel.class
          if-no-files-found: error
          retention-days: 14
