plugins {
    id 'java'
}
repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
        content { includeGroupByRegex("net\\.runelite.*") }
    }
    mavenCentral()
}
def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.runepath.sync.RunePathSyncPluginTest'
dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
    testImplementation 'junit:junit:4.13.2'
}
group = 'com.runepath.sync'
version = '0.1.0'
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}
tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}
 
// Portable Windows development build. Keep dependency JARs intact so their
// service metadata and native libraries aren't lost in a merged archive.
tasks.register('portableWindowsClient', Sync) {
    dependsOn testClasses
    into layout.buildDirectory.dir('portable-client')
    from(sourceSets.main.output) { into 'classes' }
    from(sourceSets.test.output) {
        include 'com/runepath/sync/RunePathSyncPluginTest.class'
        into 'classes'
    }
    from(configurations.testRuntimeClasspath.filter { f ->
        !f.name.matches('lwjgl.*-natives-(linux.*|macos.*|windows-x86|windows-arm64)\\.jar')
    }) { into 'lib' }
    from('LICENSE', 'THIRD_PARTY_NOTICES.md', 'README.md')
}
